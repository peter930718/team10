<html>

<style>
    .sideMenu {
        width: 300px;
        height: 100%;
        background-color: #003049;
        border-right: 3px solid #d1d1d1;
        display: flex;
        flex-direction: column;
        padding: 50px 0;
        box-shadow: 5px 0 5px rgba(#303c4d, 0.6);}
        form {
            display: flex;
            margin: 0 10px 50px;
            border-radius: 100px;
            border: 1px solid #fff;

            input {
              width: 85%;
            }

            button {
              width: 15%;
            }

            input,
            button {
              border: none;
              padding: 5px 10px;
              background-color: transparent;
              color: #fff;
            }
            input:focus,
            button:focus {
              outline: none;
            }
          }
          nav {
            a {
              display: block;
              color: #fff;
              padding: 20px 10px;
              position: relative;
              font-weight: 300;

              .fas {
                margin-right: 0em;
                transform: scale(0);
                transition: 0.3s;
              }

              &:hover .fas {
                margin-right: 1em;
                transform: scale(1);
              }

              & + a::before {
                content: "";
                position: absolute;
                border-top: 1px solid #ffffff;
                left: 10px;
                right: 10px;
                top: 0px;
              }
            }
          }
</style>
    <body>

    </form>
    <nav>

  </div>
