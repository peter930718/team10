<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國際合作計畫表單</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-buttons .dropdown {
            position: relative;
        }

        .nav-buttons button {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px; /* 增加圓角 */
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .nav-buttons button:hover {
            background-color: #555;
            transform: scale(0.95); /* 凹進效果 */
        }

        .dropdown-content {
            position: absolute;
            background-color: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 1;
            margin-top: 5px;
            min-width: 150px;
            border-radius: 4px; /* 表單內容也有圓角 */
            overflow: hidden;
            opacity: 0;
            max-height: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease, max-height 0.3s ease;
        }

        .dropdown-content a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown.open .dropdown-content {
            opacity: 1;
            transform: translateY(0);
            max-height: 500px; /* 足夠的高度來顯示內容 */
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>網頁首頁</h1>
    <div class="nav-buttons">
        <div class="dropdown">
            <button onclick="toggleDropdown(this)">Menu 1</button>
            <div class="dropdown-content">
                <a href="#">Option 1.1</a>
                <a href="#">Option 1.2</a>
                <a href="#">Option 1.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button onclick="toggleDropdown(this)">Menu 2</button>
            <div class="dropdown-content">
                <a href="#">Option 2.1</a>
                <a href="#">Option 2.2</a>
                <a href="#">Option 2.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button onclick="toggleDropdown(this)">合作表單</button>
            <div class="dropdown-content">
                <a href="#">Option 3.1</a>
                <a href="#">Option 3.2</a>
                <a href="#">Option 3.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button onclick="toggleDropdown(this)">關於我們</button>
            <div class="dropdown-content">
                <a href="#">D1114182061</a>
                <a href="#">Option 4.2</a>
                <a href="#">小小心得</a>
            </div>
        </div>
    </div>
</header>

<main style="padding: 20px; margin-bottom: 50px;">
    <h2>Welcome to My Website</h2>
    <p>Here you can find some content about my website. Use the menu in the header to explore options.</p>
</main>

<footer>
    &copy; 2025由D1114182061。版權所有。
</footer>

<script>
    function toggleDropdown(button) {
        const dropdown = button.parentElement;
        const isOpen = dropdown.classList.contains('open');

        // 關閉其他打開的下拉式表單
        document.querySelectorAll('.dropdown').forEach(d => {
            d.classList.remove('open');
        });

        // 如果之前是關閉的，則打開當前表單
        if (!isOpen) {
            dropdown.classList.add('open');
        }
    }
</script>

</body>
</html>
