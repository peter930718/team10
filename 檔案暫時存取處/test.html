<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國際合作計畫表單</title>
    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-buttons .dropdown {
            position: relative;
        }

        .nav-buttons button {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
        }

        .nav-buttons button:hover {
            background-color: #555;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 1;
            margin-top: 5px;
            min-width: 150px;
            border-radius: 4px;
            overflow: hidden;
        }

        .dropdown-content a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

<header>
    <h1>網頁首頁</h1>
    <div class="nav-buttons">
        <div class="dropdown">
            <button>Menu 1</button>
            <div class="dropdown-content">
                <a href="#">Option 1.1</a>
                <a href="#">Option 1.2</a>
                <a href="#">Option 1.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button>Menu 2</button>
            <div class="dropdown-content">
                <a href="#">Option 2.1</a>
                <a href="#">Option 2.2</a>
                <a href="#">Option 2.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button>查詢合作表單</button>
            <div class="dropdown-content">
                <a href="#">Option 3.1</a>
                <a href="#">Option 3.2</a>
                <a href="#">Option 3.3</a>
            </div>
        </div>
        <div class="dropdown">
            <button>關於我們</button>
            <div class="dropdown-content">
                <a href="#">Option 4.1</a>
                <a href="#">Option 4.2</a>
                <a href="#">Option 4.3</a>
            </div>
        </div>
    </div>
</header>

<main style="padding: 20px; margin-bottom: 50px;">
    <h2>Welcome to My Website</h2>
    <p>Here you can find some content about my website. Use the menu in the header to explore options.</p>
</main>

<footer>

</footer>

</body>
</html>
